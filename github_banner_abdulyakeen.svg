  <text x="60" y="378" font-family="Arial,sans-serif" font-size="17" fill="#1A3F6F" letter-spacing="0.5">Lagos, Nigeria  ·  Open to Remote &amp; Hybrid Roles  ·  Data-Driven Supply Chain</text>
  <rect x="1350" y="356" width="204" height="36" rx="18" fill="#132E52" stroke="#2260A8" stroke-width="1"/>
  <text x="1452" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#6FA8E0" letter-spacing="1">github.com/username</text>
